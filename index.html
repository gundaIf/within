<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Within - Find the colours inside an image</title>
<meta name="description" content="Share an image. We'll find the colours within it, name them after real pigments, and return them to you.">
<meta property="og:title" content="Within — the colours inside an image">
<meta property="og:description" content="Share an image. We'll find the colours within it, name them after real pigments, and return them to you.">

<meta name="theme-color" content="#F3EFE4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:      #F3EFE4;   /* warm cream field                 */
    --paper-deep: #ECE5D5;   /* frames, recessed panels          */
    --paper-edge: #E4DCC8;
    --ink:        #26221A;   /* warm near-black, all text        */
    --ink-soft:   #7A7263;   /* captions, data, hairline text    */
    --hair:       #D9D0BD;   /* hairlines                        */
    --hair-soft:  #E3DBC9;
    --serif: "EB Garamond", "Iowan Old Style", Georgia, serif;
    --mono:  "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --ease: cubic-bezier(.22,.61,.36,1);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    font-size:18px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100vh;
  }

  /* subtle paper grain, kept nearly invisible */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    opacity:.5;
    background-image:
      radial-gradient(rgba(120,110,88,.035) 1px, transparent 1px),
      radial-gradient(rgba(120,110,88,.025) 1px, transparent 1px);
    background-size:22px 22px, 13px 13px;
    background-position:0 0, 7px 9px;
  }

  .wrap{ position:relative; z-index:1; max-width:960px; margin:0 auto; padding:48px 28px 80px; }

  /* ---------- masthead ---------- */
  .masthead{ text-align:center; margin-bottom:40px; }
  .mark{ display:inline-flex; gap:3px; margin-bottom:14px; }
  .mark span{ width:11px; height:11px; display:block; transition:background-color .8s var(--ease); }
  .wordmark{
    font-size:34px; font-weight:500; letter-spacing:.01em; line-height:1; margin:0;
  }
  .wordmark em{ font-style:italic; font-weight:400; }
  .tagline{
    font-family:var(--mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--ink-soft); margin-top:12px;
  }

  /* ---------- shared frame ---------- */
  .panel{
    background:var(--paper-deep);
    border:1px solid var(--hair);
    padding:44px 40px;
  }

  /* ---------- empty state ---------- */
  #empty{ text-align:center; }
  .invite{
    font-size:23px; line-height:1.42; max-width:30ch; margin:0 auto 30px;
  }
  .invite em{ font-style:italic; }
  .choose{
    font-family:var(--serif); font-size:17px; color:var(--ink); background:transparent;
    border:1px solid var(--ink); padding:11px 26px; cursor:pointer;
    letter-spacing:.01em; transition:background-color .35s var(--ease), color .35s var(--ease);
  }
  .choose:hover, .choose:focus-visible{ background:var(--ink); color:var(--paper); }
  .drop-hint{
    font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-soft); margin-top:20px; min-height:1.2em; transition:color .3s var(--ease);
  }
  .examples{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--hair); margin-top:34px;
  }

  /* whole-page drag affordance */
  body.dragging{ background:var(--paper-edge); }
  body.dragging .panel{ border-color:var(--ink); }
  .dropveil{
    position:fixed; inset:14px; border:1px solid var(--ink); z-index:5;
    pointer-events:none; opacity:0; transition:opacity .25s var(--ease);
  }
  body.dragging .dropveil{ opacity:1; }

  /* ---------- result ---------- */
  #result{ display:none; }
  #result.on{ display:block; }

  .plate{ margin-bottom:30px; text-align:center; }
  .plate-inner{
    display:inline-block; background:var(--paper); padding:12px;
    border:1px solid var(--ink);
    box-shadow:0 22px 44px -30px rgba(40,34,22,.55);
    max-width:100%;
  }
  .plate-inner img{
    display:block; max-width:100%; max-height:46vh; width:auto; height:auto;
    opacity:0; transform:scale(.985); transition:opacity .7s var(--ease), transform .7s var(--ease);
  }
  #result.revealed .plate-inner img{ opacity:1; transform:none; }

  /* index strip */
  .spine{ display:flex; height:10px; margin:0 auto 26px; max-width:560px;
    outline:1px solid rgba(38,34,26,.14); }
  .spine span{ flex:1; transform:scaleY(0); transform-origin:bottom; transition:transform .5s var(--ease); }
  #result.revealed .spine span{ transform:none; }

  /* swatch columns */
  .swatches{
    display:grid; gap:6px;
    grid-template-columns:repeat(var(--n,10), 1fr);
  }
  .swatch{
    background:none; border:0; padding:0; cursor:pointer; font-family:inherit;
    opacity:0; transform:translateY(10px);
    transition:opacity .5s var(--ease), transform .5s var(--ease);
    transition-delay:calc(var(--i,0) * 55ms);
  }
  #result.revealed .swatch{ opacity:1; transform:none; }
  .chip{
    display:block;
    position:relative; height:274px; width:100%; overflow:hidden;
    outline:1px solid rgba(38,34,26,.10); outline-offset:-1px;
    transition:transform .3s var(--ease);
  }
  .swatch:hover .chip, .swatch:focus-visible .chip{ transform:translateY(-3px); }
  .swatch:focus-visible{ outline:none; }
  .swatch:focus-visible .chip{ outline:1.5px solid var(--ink); outline-offset:2px; }
  /* label lives inside the column, rotated, reading bottom-to-top */
  .cap{
    position:absolute; bottom:18px; left:0; right:0; margin:0 auto; width:max-content;
    writing-mode:vertical-rl; transform:rotate(180deg);
    display:flex; flex-direction:column; gap:8px; align-items:flex-start;
    pointer-events:none;
  }
  .cap .hx{ font-family:var(--mono); font-size:11px; letter-spacing:.09em; text-transform:uppercase; opacity:.92; }
  .cap .nm{ font-style:italic; font-size:18px; line-height:1; }

  /* controls */
  .controls{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:18px;
    margin-top:34px; padding-top:22px; border-top:1px solid var(--hair);
    opacity:0; transition:opacity .6s var(--ease) .3s;
  }
  #result.revealed .controls{ opacity:1; }
  .stepper{ display:flex; align-items:center; gap:14px;
    font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); }
  .stepper button{
    font-family:var(--mono); font-size:15px; width:28px; height:28px; line-height:1;
    background:transparent; border:1px solid var(--hair); color:var(--ink); cursor:pointer;
    transition:border-color .3s var(--ease), background-color .3s var(--ease);
  }
  .stepper button:hover:not(:disabled){ border-color:var(--ink); }
  .stepper button:disabled{ opacity:.35; cursor:default; }
  .stepper .num{ min-width:1.4em; text-align:center; color:var(--ink); font-size:13px; }
  .actions{ display:flex; gap:12px; }
  .btn{
    font-family:var(--serif); font-size:16px; padding:9px 20px; cursor:pointer; background:transparent;
    border:1px solid var(--ink); color:var(--ink);
    transition:background-color .35s var(--ease), color .35s var(--ease);
  }
  .btn:hover, .btn:focus-visible{ background:var(--ink); color:var(--paper); }
  .btn.ghost{ border-color:var(--hair); color:var(--ink-soft); }
  .btn.ghost:hover, .btn.ghost:focus-visible{ background:transparent; border-color:var(--ink); color:var(--ink); }

  .coda{ text-align:center; font-style:italic; color:var(--ink-soft); font-size:16px;
    margin:38px auto 0; max-width:44ch; }
  .status{ text-align:center; font-family:var(--mono); font-size:11px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--ink-soft); min-height:1.2em; margin-top:38px; }

  /* toast */
  .toast{
    position:fixed; left:50%; bottom:30px; transform:translate(-50%,14px);
    background:var(--paper); border:1px solid var(--ink); color:var(--ink);
    padding:11px 20px; font-size:15px; z-index:20; opacity:0; pointer-events:none;
    box-shadow:0 16px 34px -24px rgba(40,34,22,.6);
    transition:opacity .35s var(--ease), transform .35s var(--ease);
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
  .toast .tnm{ font-style:italic; }
  .toast .thx{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); letter-spacing:.06em; }

  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  @media (max-width:680px){
    .wrap{ padding:36px 18px 64px; }
    .panel{ padding:32px 22px; }
    .swatches{ grid-template-columns:repeat(3,1fr); gap:6px; }
    .chip{ height:230px; }
    .cap .nm{ font-size:16px; }
    .controls{ justify-content:center; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; }
    .plate-inner img, .swatch, .spine span, .controls{ transition:none; opacity:1; transform:none; }
    .chip{ transition:none; }
  }
</style>
</head>
<body>
  <div class="dropveil" aria-hidden="true"></div>

  <div class="wrap">
    <header class="masthead">
      <div class="mark" id="mark" aria-hidden="true">
        <span style="background:#96502E"></span><span style="background:#C99B3B"></span>
        <span style="background:#566A44"></span><span style="background:#607080"></span>
      </div>
      <h1 class="wordmark"><em>Within</em></h1>
      <p class="tagline">Find the colours inside an image</p>
    </header>

    <!-- EMPTY STATE -->
    <section id="empty" class="panel" aria-labelledby="invite-t">
      <p class="invite" id="invite-t">Share an image. We'll find the colours <em>within</em> it, and return them to you.</p>
      <button class="choose" id="chooseBtn">Choose an image</button>
      <p class="drop-hint" id="dropHint">or drop one anywhere on this page</p>
      <p class="examples">A painting · a photograph · a film still · a room you liked</p>
      <input type="file" id="file" accept="image/*" class="sr" aria-hidden="true">
    </section>

    <!-- RESULT STATE -->
    <section id="result" aria-live="polite">
      <div class="plate">
        <div class="plate-inner"><img id="shot" alt="The image you shared"></div>
      </div>
      <div class="spine" id="spine" aria-hidden="true"></div>
      <div class="swatches" id="swatches"></div>

      <div class="controls">
        <div class="stepper" role="group" aria-label="Number of colours">
          <span>Colours</span>
          <button id="minus" aria-label="Fewer colours">–</button>
          <span class="num" id="count" aria-live="polite">10</span>
          <button id="plus" aria-label="More colours">+</button>
        </div>
        <div class="actions">
          <button class="btn" id="save">Save the card</button>
          <button class="btn ghost" id="again">Try another</button>
        </div>
      </div>

      <p class="coda">These colours were found within your image, and returned to you with care.</p>
    </section>

    <p class="status" id="status" aria-live="polite"></p>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ============================================================
   CONFIG — a couple of dials you can turn.
   SITE_LABEL: put your handle or URL here to sign the export card.
   Leave "" to omit.
   ============================================================ */
const SITE_LABEL = "deeeen.xyz";       // signs the exported card
const CARD_KICKER = "FOUND WITHIN";    // small caption printed on the export card
const COLUMN_GRADIENT = false;         // false = solid columns (matches the reference); true = deepen top->bottom

/* ---------- colour math: sRGB -> Lab ---------- */
function srgbToLin(c){ c/=255; return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); }
function rgbToLab(r,g,b){
  r=srgbToLin(r); g=srgbToLin(g); b=srgbToLin(b);
  let x=r*0.4124+g*0.3576+b*0.1805, y=r*0.2126+g*0.7152+b*0.0722, z=r*0.0193+g*0.1192+b*0.9505;
  const xn=0.95047,yn=1,zn=1.08883, f=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116;
  const fx=f(x/xn),fy=f(y/yn),fz=f(z/zn);
  return [116*fy-16, 500*(fx-fy), 200*(fy-fz)];
}
const chroma = lab => Math.hypot(lab[1],lab[2]);
const de76 = (a,b) => Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
const hex = (r,g,b) => "#" + [r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("").toUpperCase();
const lumOf = (r,g,b) => (0.299*r + 0.587*g + 0.114*b) / 255;
const INK = "#26221A", CREAM = "#F3EFE4";
const labelInkFor = rgb => lumOf(...rgb) > 0.58 ? INK : CREAM;   // legible label on a column

/* ---------- lightness shift, for the column gradient ---------- */
function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2;
  let h=0,s=0; const d=mx-mn;
  if(d){ s = l>0.5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx===r ? (g-b)/d+(g<b?6:0) : mx===g ? (b-r)/d+2 : (r-g)/d+4; h/=6; }
  return [h,s,l];
}
function hslToRgb(h,s,l){
  if(!s) { const v=Math.round(l*255); return [v,v,v]; }
  const q = l<0.5 ? l*(1+s) : l+s-l*s, p = 2*l-q;
  const t = n => { n=(n+1)%1; return n<1/6 ? p+(q-p)*6*n : n<1/2 ? q : n<2/3 ? p+(q-p)*(2/3-n)*6 : p; };
  return [t(h+1/3),t(h),t(h-1/3)].map(v=>Math.round(v*255));
}
/* deepen a colour by dropping its lightness (dL in 0..1), keeping hue + saturation */
function shade(rgb, dL){
  const [h,s,l] = rgbToHsl(rgb[0],rgb[1],rgb[2]);
  return hslToRgb(h, Math.min(1, s*1.04), Math.max(0.035, l+dL));
}
const GRAD_DROP = -0.20;   // how far the column deepens from top to bottom

/* ---------- curated pigment / tonal vocabulary ---------- */
const NAMES = {
 "Vermilion":"E34234","Cadmium Red":"D6212C","Scarlet":"C0362C","Crimson":"9E2136","Alizarin Crimson":"8E2431",
 "Carmine":"8C0E22","Rose Madder":"A3475A","Terracotta":"C56A4E","Brick":"9C4A3C","Rust":"9E4A2E",
 "Venetian Red":"9E3A2C","Tuscan Red":"7C3B34","Oxblood":"6B2A28","Maroon":"5A2A2A","Rosewood":"6E3A34",
 "Coral":"E4796B","Salmon":"E39082","Cinnabar":"C24A34",
 "Blush":"D8A9AC","Dusty Rose":"C08A94","Old Rose":"B37A82","Ash Rose":"B48C90","Antique Pink":"C6928E",
 "Flesh":"E4B49E","Peach":"E7B79E","Clay":"B48478","Rose Quartz":"D4A6AC",
 "Yellow Ochre":"C99B45","Naples Ochre":"C99B3B","Raw Sienna":"B67C3E","Burnt Sienna":"96502E","Raw Umber":"7A5A38",
 "Burnt Umber":"5C3A25","Van Dyke Brown":"4A342A","Sepia":"5A4632","Umber":"6B4E32","Bronze":"7C6A3E",
 "Amber":"C08A2E","Copper":"A9603C","Chestnut":"7A4A34","Russet":"7E4A32","Tobacco":"6E5236",
 "Fawn":"C9A57E","Sand":"D8C29A","Buff":"D8C79E","Khaki":"A99A6A","Camel":"C19A6B","Tan":"B99172",
 "Caramel":"A9743E","Ginger":"A55C2E","Coffee":"4B3621","Chocolate":"3D2B1F","Mahogany":"6B3A2A",
 "Walnut":"5B4636","Wheat":"DCC79A","Brown Ochre":"8C7440","Ochre":"C99A34",
 "Gold":"C9A227","Old Gold":"C0A54A","Goldenrod":"C99A2E","Mustard":"C9A93C","Honey":"D6A94C",
 "Straw":"D6C877","Flax":"D3C27A","Citron":"C6C24E","Antique Gold":"B48B2E","Naples Yellow":"EED9A0",
 "Cream":"EFE6C8","Ivory":"EDE6D0",
 "Olive":"6B6A2E","Olive Drab":"5A5A34","Moss":"6A7A46","Sage":"9AA98E","Sap Green":"4E6B34",
 "Terre Verte":"5A6E52","Earth Green":"566A44","Fern":"4E6B44","Forest Green":"24503A","Pine":"1F4A34",
 "Bottle Green":"143C2C","Viridian":"3A7A63","Emerald":"2E7D5B","Malachite":"2E6E52","Jade":"4E8B6E",
 "Celadon":"A9C2A6","Verdigris":"5FA08C","Spruce":"2E4A40","Pistachio":"B7C48E","Green Earth":"6E7A52","Reseda":"8A946A",
 "Prussian Blue":"1E3A4C","Payne's Grey":"3A4A54","Slate Blue":"4A5A6E","Greyish Azure":"607080","Steel Blue":"4E6B82",
 "Denim":"3E5A78","Indigo":"2E3A5C","Navy":"23324A","Cobalt":"2E4A8C","Ultramarine":"33418C",
 "Cerulean":"2E6E9E","Azure":"3E7CA8","Sky":"8FB3CC","Powder Blue":"B7CBD8","Teal":"26666A",
 "Petrol":"26565C","Peacock":"1F5A6E","Ice":"CBD8DC","Dusk":"6A7E92",
 "Mauve":"9A7C9A","Plum":"6E3A5A","Aubergine":"4A2A3A","Violet":"6A4A8C","Amethyst":"7A5A8C",
 "Lilac":"B7A6C8","Heather":"9A8AA6","Wine":"5A2A3C","Orchid":"A96EA9"
};
const NAME_LABS = Object.entries(NAMES).map(([n,h])=>({
  n, lab: rgbToLab(parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16))
}));
const ROMAN = ["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];

function greyName(lab){
  const L=lab[0], b=lab[2];
  if(L<11) return "Black";
  if(L<20) return "Soft Black";
  if(L<32) return "Charcoal";
  if(L<44) return "Graphite";
  if(L<56) return "Slate Grey";
  if(L<70) return b>=1.5 ? "Warm Grey" : b<=-1.5 ? "Cool Grey" : "Grey";
  if(L<82) return "Ash";
  if(L<90) return "Pearl";
  return "Chalk";
}
function nameOne(rgb){
  const lab = rgbToLab(rgb[0],rgb[1],rgb[2]);
  if(chroma(lab) < 9) return greyName(lab);
  let best=null, bd=1e9;
  for(const e of NAME_LABS){ const d=de76(lab,e.lab); if(d<bd){ bd=d; best=e; } }
  const dL = lab[0]-best.lab[0], dC = chroma(lab)-chroma(best.lab);
  let mod = "";
  if(dL <= -15) mod = "Dark ";
  else if(dL >= 16) mod = "Light ";
  else if(dC <= -14) mod = "Muted ";
  if(/^(Black|Soft Black|Charcoal|Ivory|Cream|Chalk|Naples Yellow)/.test(best.n)) mod = "";
  return mod + best.n;
}
function namePalette(rgbs){
  const raw = rgbs.map(nameOne);
  const counts = {}; raw.forEach(n=>counts[n]=(counts[n]||0)+1);
  const seen = {};
  return raw.map(n=>{ if(counts[n]>1){ seen[n]=(seen[n]||0)+1; return n+" "+ROMAN[seen[n]]; } return n; });
}

/* ---------- extraction: median cut, weighted by region size ---------- */
function medianCut(pixels, target){
  let boxes = [pixels];
  const stat = box => {
    let rmin=255,rmax=0,gmin=255,gmax=0,bmin=255,bmax=0;
    for(const p of box){
      if(p[0]<rmin)rmin=p[0]; if(p[0]>rmax)rmax=p[0];
      if(p[1]<gmin)gmin=p[1]; if(p[1]>gmax)gmax=p[1];
      if(p[2]<bmin)bmin=p[2]; if(p[2]>bmax)bmax=p[2];
    }
    const rr=rmax-rmin, gr=gmax-gmin, br=bmax-bmin;
    const ch = rr>=gr && rr>=br ? 0 : gr>=br ? 1 : 2;
    return { ch, range:Math.max(rr,gr,br), priority:Math.max(rr,gr,br)*Math.pow(box.length,0.75) };
  };
  while(boxes.length < target){
    let bi=-1, bp=-1;
    for(let i=0;i<boxes.length;i++){
      if(boxes[i].length<2) continue;
      const p = stat(boxes[i]).priority;
      if(p>bp){ bp=p; bi=i; }
    }
    if(bi<0) break;
    const box = boxes[bi], ch = stat(box).ch;
    box.sort((a,b)=>a[ch]-b[ch]);
    const mid = box.length>>1;
    boxes.splice(bi,1, box.slice(0,mid), box.slice(mid));
  }
  return boxes.filter(b=>b.length).map(box=>{
    let r=0,g=0,b=0; for(const p of box){ r+=p[0]; g+=p[1]; b+=p[2]; }
    const n=box.length; return [r/n,g/n,b/n];
  });
}
function sortPalette(rgbs){
  const key = rgb => {
    const lab = rgbToLab(rgb[0],rgb[1],rgb[2]);
    const c = chroma(lab);
    let hue = Math.atan2(lab[2],lab[1]) * 180/Math.PI; if(hue<0) hue+=360;
    const achromatic = c < 12;
    return { achromatic, hue, L:lab[0] };
  };
  return rgbs.map(rgb=>({rgb,k:key(rgb)})).sort((a,b)=>{
    if(a.k.achromatic!==b.k.achromatic) return a.k.achromatic?1:-1;   // neutrals to the end
    if(a.k.achromatic) return b.k.L-a.k.L;                            // neutrals dark->light
    if(Math.abs(a.k.hue-b.k.hue)>4) return a.k.hue-b.k.hue;           // then by hue
    return b.k.L-a.k.L;
  }).map(o=>o.rgb);
}

/* ---------- state ---------- */
let workingPixels = null;   // downsampled pixels, cached for instant recount
let sourceImg = null;       // <img> element for display + export
let paletteRGB = [];        // current [ [r,g,b], ... ]
let paletteNames = [];
let count = 10;
const CLAMP = [4,12];

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const empty=$("empty"), result=$("result"), fileInput=$("file"),
      shot=$("shot"), spine=$("spine"), swatchesEl=$("swatches"),
      status=$("status"), toast=$("toast"), countEl=$("count"),
      minus=$("minus"), plus=$("plus"), dropHint=$("dropHint"), mark=$("mark");

const READING = ["Reading the light in your image…","Sorting the pigments…","Naming what we found…"];

/* ---------- flow ---------- */
$("chooseBtn").addEventListener("click", ()=>fileInput.click());
fileInput.addEventListener("change", e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); });
$("again").addEventListener("click", reset);
$("save").addEventListener("click", exportCard);
minus.addEventListener("click", ()=>recount(-1));
plus.addEventListener("click", ()=>recount(1));

/* drag + drop anywhere */
let dragDepth = 0;
window.addEventListener("dragenter", e=>{ e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); dropHint.textContent="yes — right here"; });
window.addEventListener("dragover", e=>e.preventDefault());
window.addEventListener("dragleave", e=>{ e.preventDefault(); if(--dragDepth<=0){ document.body.classList.remove("dragging"); dropHint.textContent="or drop one anywhere on this page"; } });
window.addEventListener("drop", e=>{
  e.preventDefault(); dragDepth=0; document.body.classList.remove("dragging");
  dropHint.textContent="or drop one anywhere on this page";
  const f=[...e.dataTransfer.files].find(x=>x.type.startsWith("image/"));
  if(f) handleFile(f);
});
/* paste an image */
window.addEventListener("paste", e=>{
  const it=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith("image/"));
  if(it) handleFile(it.getAsFile());
});

function handleFile(file){
  const started = performance.now();
  status.textContent = READING[0];
  let ri=0; const rot=setInterval(()=>{ ri=(ri+1)%READING.length; status.textContent=READING[ri]; }, 260);

  const img = new Image();
  img.onload = ()=>{
    sourceImg = img;
    // downsample for extraction
    const cap = 240, scale = Math.min(1, cap/Math.max(img.width,img.height));
    const w = Math.max(1,Math.round(img.width*scale)), h = Math.max(1,Math.round(img.height*scale));
    const c = document.createElement("canvas"); c.width=w; c.height=h;
    const ctx = c.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(img,0,0,w,h);
    const data = ctx.getImageData(0,0,w,h).data;
    const px = [];
    for(let i=0;i<data.length;i+=4){ if(data[i+3]>=128) px.push([data[i],data[i+1],data[i+2]]); }
    workingPixels = px;

    shot.src = img.src;
    buildPalette();

    const settle = Math.max(0, 780 - (performance.now()-started));  // let the care be felt
    setTimeout(()=>{
      clearInterval(rot); status.textContent="";
      empty.style.display="none"; result.classList.add("on");
      requestAnimationFrame(()=>requestAnimationFrame(()=>result.classList.add("revealed")));
    }, settle);
  };
  img.onerror = ()=>{ clearInterval(rot); status.textContent="that file wouldn't open — try another image"; };
  const reader = new FileReader();
  reader.onload = ev => img.src = ev.target.result;
  reader.readAsDataURL(file);
}

function buildPalette(){
  const pool = workingPixels.map(p=>p.slice());   // median cut mutates order
  paletteRGB = sortPalette(medianCut(pool, count)).map(c=>[Math.round(c[0]),Math.round(c[1]),Math.round(c[2])]);
  paletteNames = namePalette(paletteRGB);
  renderSpine();
  renderSwatches();
  recolorMark();
  document.documentElement.style.setProperty("--n", paletteRGB.length);
}

function renderSpine(){
  spine.innerHTML="";
  paletteRGB.forEach((rgb,i)=>{ const s=document.createElement("span");
    s.style.background=hex(...rgb); s.style.transitionDelay=(i*20)+"ms"; spine.appendChild(s); });
}
function renderSwatches(){
  swatchesEl.innerHTML="";
  paletteRGB.forEach((rgb,i)=>{
    const h = hex(...rgb), nm = paletteNames[i];
    const fill = COLUMN_GRADIENT
      ? `linear-gradient(180deg, ${h} 0%, ${hex(...shade(rgb,GRAD_DROP))} 100%)`
      : h;
    const ink = labelInkFor(COLUMN_GRADIENT ? shade(rgb,GRAD_DROP) : rgb);
    const b = document.createElement("button");
    b.className="swatch"; b.style.setProperty("--i", i);
    b.setAttribute("aria-label", `${nm}, ${h}. Copy hex.`);
    b.innerHTML =
      `<span class="chip" style="background:${fill}">` +
        `<span class="cap" style="color:${ink}">` +
          `<span class="hx">${h}</span><span class="nm">${nm}</span>` +
        `</span>` +
      `</span>`;
    b.addEventListener("click", ()=>copyHex(h,nm));
    swatchesEl.appendChild(b);
  });
}
function recolorMark(){
  const picks = paletteRGB.slice(0,4);
  [...mark.children].forEach((sp,i)=>{ if(picks[i]) sp.style.background = hex(...picks[i]); });
}

function recount(d){
  const next = Math.max(CLAMP[0], Math.min(CLAMP[1], count+d));
  if(next===count) return;
  count = next; countEl.textContent = count;
  minus.disabled = count<=CLAMP[0]; plus.disabled = count>=CLAMP[1];
  // rebuild + quick re-stagger
  result.classList.remove("revealed");
  buildPalette();
  requestAnimationFrame(()=>requestAnimationFrame(()=>result.classList.add("revealed")));
}

async function copyHex(h,nm){
  try{ await navigator.clipboard.writeText(h); }
  catch{ const t=document.createElement("textarea"); t.value=h; document.body.appendChild(t); t.select();
    try{ document.execCommand("copy"); }catch{} t.remove(); }
  showToast(`Copied &nbsp;<span class="thx">${h}</span>&nbsp; — <span class="tnm">${nm}</span>`);
}
let toastTimer=null;
function showToast(html){
  toast.innerHTML=html; toast.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove("show"), 1900);
}

function reset(){
  result.classList.remove("on","revealed");
  empty.style.display=""; status.textContent=""; fileInput.value="";
  workingPixels=null; sourceImg=null; paletteRGB=[]; paletteNames=[];
}

/* ============================================================
   EXPORT — a portrait card, in the spirit of the reference.
   ============================================================ */
async function exportCard(){
  if(!sourceImg) return;
  status.textContent = "Composing the card…";

  // make sure the fonts are ready before we paint text to canvas
  try{
    await document.fonts.load('italic 400 40px "EB Garamond"');
    await document.fonts.load('500 40px "EB Garamond"');
    await document.fonts.load('400 24px "IBM Plex Mono"');
    await document.fonts.ready;
  }catch{}

  const S = 2;                      // supersample for crispness
  const W = 1080, H = 1620;         // 2:3 poster
  const cv = document.createElement("canvas");
  cv.width = W*S; cv.height = H*S;
  const ctx = cv.getContext("2d");
  ctx.scale(S,S);
  ctx.textBaseline = "alphabetic";
  const paper = "#F3EFE4", ink = "#26221A", inkSoft = "#7A7263";

  // field
  ctx.fillStyle = paper; ctx.fillRect(0,0,W,H);

  const M = 84;                     // outer margin
  const capW = 40;                  // right column reserved for vertical caption

  // ---- image plate ----
  const plateX = M, plateY = M, plateMaxW = W - M - capW - M, plateMaxH = 760;
  const ir = sourceImg.width/sourceImg.height;
  let iw = plateMaxW, ih = iw/ir;
  if(ih > plateMaxH){ ih = plateMaxH; iw = ih*ir; }
  const ix = plateX + (plateMaxW - iw)/2, iy = plateY;
  ctx.save();
  ctx.shadowColor = "rgba(40,34,22,.35)"; ctx.shadowBlur = 46; ctx.shadowOffsetY = 26;
  ctx.fillStyle = "#fff"; ctx.fillRect(ix-12, iy-12, iw+24, ih+24);   // paper mat
  ctx.restore();
  ctx.drawImage(sourceImg, ix, iy, iw, ih);
  ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.strokeRect(ix-12+1, iy-12+1, iw+24-2, ih+24-2);
  const plateBottom = iy - 12 + ih + 24;

  // ---- right vertical caption (rotated) ----
  ctx.save();
  ctx.translate(W - M + 20, plateY + 6);
  ctx.rotate(Math.PI/2);
  setTracking(ctx, 3);
  ctx.font = '500 15px "IBM Plex Mono", monospace'; ctx.fillStyle = ink;
  ctx.fillText(CARD_KICKER, 0, 0);
  ctx.font = '400 13px "IBM Plex Mono", monospace'; ctx.fillStyle = inkSoft;
  const dateStr = new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}).toUpperCase();
  const rightTail = SITE_LABEL ? (dateStr + "   ·   " + SITE_LABEL.toUpperCase()) : dateStr;
  ctx.fillText(rightTail, 0, 22);
  setTracking(ctx, 0);
  ctx.restore();

  // ---- index spine ----
  const spineY = plateBottom + 46, spineH = 12, spineX = M, spineW = W - M - capW - M;
  const seg = spineW / paletteRGB.length;
  paletteRGB.forEach((rgb,i)=>{ ctx.fillStyle = hex(...rgb); ctx.fillRect(spineX + i*seg, spineY, Math.ceil(seg)+0.5, spineH); });
  ctx.strokeStyle = "rgba(38,34,26,.18)"; ctx.lineWidth = 1; ctx.strokeRect(spineX+.5, spineY+.5, spineW-1, spineH-1);

  // ---- swatch columns with rotated labels ----
  const colTop = spineY + spineH + 40;
  const footerH = 92;
  const colBottom = H - M - footerH;
  const colH = colBottom - colTop;
  const colW = spineW / paletteRGB.length;
  paletteRGB.forEach((rgb,i)=>{
    const x = spineX + i*colW;
    const bottomRGB = shade(rgb, GRAD_DROP);
    if(COLUMN_GRADIENT){
      const g = ctx.createLinearGradient(0, colTop, 0, colBottom);
      g.addColorStop(0, hex(...rgb));
      g.addColorStop(1, hex(...bottomRGB));
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = hex(...rgb);
    }
    ctx.fillRect(x, colTop, Math.ceil(colW)+0.5, colH);
    ctx.strokeStyle = "rgba(38,34,26,.08)"; ctx.lineWidth = 1;
    ctx.strokeRect(x+.5, colTop+.5, colW-1, colH-1);

    const onInk = lumOf(...(COLUMN_GRADIENT ? bottomRGB : rgb)) > 0.56 ? ink : "#F3EFE4";
    ctx.save();
    ctx.translate(x + colW/2, colBottom - 22);
    ctx.rotate(-Math.PI/2);
    ctx.fillStyle = onInk;
    ctx.font = 'italic 400 26px "EB Garamond", Georgia, serif';
    ctx.fillText(paletteNames[i], 0, -8);
    setTracking(ctx, 1.2);
    ctx.font = '400 15px "IBM Plex Mono", monospace';
    ctx.globalAlpha = .82;
    ctx.fillText(hex(...rgb), 0, 15);
    ctx.globalAlpha = 1; setTracking(ctx, 0);
    ctx.restore();
  });

  // ---- footer line + mark ----
  ctx.fillStyle = ink;
  ctx.font = 'italic 400 22px "EB Garamond", Georgia, serif';
  ctx.textAlign = "center";
  ctx.fillText("These colours were found within your image, and returned to you.",
               W/2, H - M - footerH + 58);
  // tiny mark
  const mkY = H - M - 22, mkX = W/2 - 24;
  paletteRGB.slice(0,4).forEach((rgb,i)=>{ ctx.fillStyle=hex(...rgb); ctx.fillRect(mkX + i*13, mkY, 10, 10); });
  ctx.textAlign = "left";

  // ---- download ----
  cv.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "colours-found-within.png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    status.textContent=""; showToast("Saved. The card is yours.");
  }, "image/png");
}

/* letter-spacing on canvas, where supported */
function setTracking(ctx, px){ try{ ctx.letterSpacing = px+"px"; }catch{} }
</script>
</body>
</html>
